<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         ul{
            
            width: 200px;
            list-style-type:none;
            font-weight: 100px;
         }

         li{
            padding: 20px;
            margin: 20px;
            margin-top: 15px;
            border: 5px solid red;
            border-radius: 50%;

         }

         ul:nth-child{
            color:black;
            background-color: white;
         }

         li:nth-child(even){
            color:white;
            background-color: black;
         }

         li:nth-child(odd){
            color:black;
            background-color: yellow;
         }
