<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style3.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="text-center ">Contact Form</h1>
<form action="">
    <div class="container text-center">
        <div class="row">
            <div class="col-md-12 p-4">
                <label for="name"><b>Name:</b></label>

                <input type="text" class="mb-4" id="name" name="name" placeholder="Enter your name">
                 <br>
                <label  class="mb-4" for="email"><b>Email:</b></label>
                <input type="text "  id="email" name="email" placeholder="Enter your Email">   
                 <br>
                 <label for="phone" class="mb-4" > <b>Phone:</b></label>
                 <input type="number"  id="phone" name="phone" placeholder="Enter Your Number">
                <br>
                <label class="mb-4" for="password" ><b>Password:</b></label>
                <input type="password" id="password" name="password" placeholder="Enter Your Password">
                <br>
                <label for="confirmPassword" class="mb-4"><b>Confirm Passwor:d</b> </label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Your Password">
                <br>
                <label for="message" class="mb-4 "><b>Message:</b></label>
                <textarea  type="text " id="message" name="message" placeholder="Type here message" rows="5"></textarea>
                <br>
                <label for="gender" class="mb-4"><b>Gender:</b>
                <input type="radio" id="radio" name="radio" > Male </label>
                <input type="radio" id="radio" name="radio" > Female </label>
                <input type="radio" id="radio" name="radio" > Other </label>

                <br>
                <label for="checkbox"><b></b>
                <input type="checkbox" id="checkbox" name="checkbox" > I agree to the terms & Conditions
                </label>
                   <br>
                <button class="text-center text-warning"> Submit</button>

            </div>
        </div>
    </div>
</form>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
